name: DOTATI 2027 - San Leucio cross-reading

on:
  workflow_dispatch:

jobs:
  dotati2027-cross-reading:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install DOTATI 2027 dependencies
        run: |
          pip install -r requirements.txt


      - name: Verify DOTATI 2027 files
        run: |
          echo "Repository contents:"
          ls -la


      - name: Run DOTATI 2027 cross-reading
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Starting DOTATI 2027 pipeline"
          python main.py
